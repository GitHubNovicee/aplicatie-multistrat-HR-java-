# logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.root=INFO

# logging audit service (activati pentru fisier daca este nevoie)
#logging.file.name=logs/hr-audit.log
#logging.level.org.hr.services.HrAuditingServiceImpl=DEBUG

# Sprint 3: persistenta JPA (H2 in-memory; schema generata din entitatile JPA)
spring.datasource.url=jdbc:h2:mem:hrdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.format_sql=true
# regulile de validare sunt aplicate explicit de serviciile de validare (Sprint 2), nu la flush
spring.jpa.properties.jakarta.persistence.validation.mode=none
# jurnal SQL (activati la nevoie)
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
